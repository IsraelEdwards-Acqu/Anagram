<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anagram</title>
    <base href="/" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/chat-layout.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/updates.css" />
    <link rel="stylesheet" href="css/auth.css" />

    <!-- App Manifest & Icons -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="icon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Meta Branding -->
    <meta name="theme-color" content="#f9f9f9" />
    <meta name="description" content="Anagram — fluid, modern communication hub." />
</head>

<body>
    <!-- Loader -->
    <div class="loading-container">
        <div class="loading-text">Loading…</div>
    </div>

    <!-- Blazor root -->
    <div id="app"></div>

    <!-- Blazor Runtime -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Loader Logic -->
    <script>
        window.addEventListener('load', () => {
            const container = document.querySelector('.loading-container');
            if (!container) return;
            setTimeout(() => {
                container.style.transition = 'opacity 0.6s ease';
                container.style.opacity = '0';
                setTimeout(() => container.remove(), 600);
            }, 3000);
        })
    </script>

    <!-- Interop helpers -->
    <script>
        window.interop = {
            scrollToBottom: (el) => {
                try {
                    if (!el) return;
                    el.scrollTop = el.scrollHeight;
                } catch (e) { /* ignore */ }
            },
            pickFile: async () => null,
            capturePhoto: async () => null,
            recordVoiceNote: async () => null
        };
    </script>

    <!-- Chat helpers -->
    <script src="js/chat-helpers.js"></script>
    <script src="js/interop.js"></script>
</body>
</html>
